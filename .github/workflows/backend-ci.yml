name: Backend Docker CI

on:
  push:
    branches: [master]
    paths:
      - 'Alance-finance-user-backend-main/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'Alance-finance-user-backend-main/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  docker-build:
    name: Build and push backend image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Alance-finance-user-backend-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -f dockerfile -t alance-finance-backend:ci .

      - name: Verify Node.js runtime
        run: docker run --rm --entrypoint node alance-finance-backend:ci --version

      - name: Verify compiled backend
        run: docker run --rm --entrypoint sh alance-finance-backend:ci -c "test -f /app/dist/index.js && echo 'Backend build files found'"

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag alance-finance-backend:ci "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker tag alance-finance-backend:ci "$REGISTRY/$REPOSITORY:latest"
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"
